[package]
name        = "trace-devices"
description = "DeviceDriver trait, drivers and virtual device simulators."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true

[lints]
workspace = true

[features]
default = ["tcp", "simulator"]
# Raw TCP line protocol: torque wrenches, scales and scanners on Ethernet.
tcp       = []
# Virtual devices, so the whole system is testable in CI with zero hardware.
simulator = []

[dependencies]
trace-core  = { workspace = true }
tokio       = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
chrono      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
